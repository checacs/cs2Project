<ion-header>
  <ion-toolbar>
    <ion-back-button slot="start" routerLink="/"></ion-back-button>
    <div class="logo-title ion-padding">
      <img src="/assets/images/header2.png" routerLink="/" alt="">
    </div>
    <ion-buttons slot="end">
      <ion-menu-toggle menu="menu-lateral">
        <ion-avatar>
          <img src="assets/images/iconmenu.webp">
        </ion-avatar>
      </ion-menu-toggle>
    </ion-buttons>
  </ion-toolbar>
  <ion-searchbar class="search-gradient" mode="ios" [animated]="true"
                 placeholder = "Buscar armas"
                 (ionInput)="buscar($event)"></ion-searchbar>
</ion-header>

<ion-content class="ion-padding bg-gradient">

  <ion-list class="transparent-col">
    @for (skin of skinsList; track skin.id){
      <ion-modal #modal [trigger]="'idmodal' + skin.id" class="modal-card-transparent">
        <ng-template>
          <ion-content>
            <ion-card >
              <ion-card-header>

              </ion-card-header>
              <ion-img [src]="skin.image" class="ion-padding"></ion-img>
              <ion-card-content>
                <ion-card-title>{{skin.name}}</ion-card-title>
                @if (skin.stattrak) {
                  <h2>Stattrak: SI</h2>
                }@else {
                  <h2>Stattrak: NO</h2>
                }

                <h4>Tipo arma: {{skin.weapon.name}}</h4>
              </ion-card-content>
            </ion-card>
            <ion-footer class="ion-no-border">
              <ion-toolbar >
                <ion-buttons slot="start">
                  <ion-button class="ion-align-content-center" color="success"
                              (click)="addFavoritos(skin); modal.dismiss()">
                    <h6 class="margen-izq">Añadir a Favoritos</h6>
                    </ion-button>
                </ion-buttons>
              </ion-toolbar>
            </ion-footer>
          </ion-content>
        </ng-template>
      </ion-modal>
      <ion-item-sliding [id]="'idmodal' + skin.id">
        <ion-item >
          <ion-thumbnail slot="start" class="img-icon-list">
            <ion-img [src]="skin.image" class="img-icon-list"></ion-img>
          </ion-thumbnail>
          <ion-label class="ion-text-center">
            <h2>{{skin.name}}</h2>
          </ion-label>
        </ion-item>
      </ion-item-sliding>
    }
  </ion-list>
  <ion-infinite-scroll (ionInfinite)="loadMore($event)">
    <ion-infinite-scroll-content loading-spinner="dots"></ion-infinite-scroll-content>
  </ion-infinite-scroll>
</ion-content>
