<ion-menu side="end" menuId="menu-lateral" contentId="principal">
  <ion-header class="ion-no-border">
    <ion-toolbar>
      <ion-avatar>
        <ion-img src="/assets/images/cs2Menu.jpg"></ion-img>
      </ion-avatar>
      <ion-title>Armas Favoritas</ion-title>
    </ion-toolbar>
  </ion-header>
  <ion-content class="ion-padding">
    <ion-list>
      <ion-list-header>
        <h2>Mis Favoritos</h2>
      </ion-list-header>
      @if (favoritosList.length >0){
        @for (skins of favoritosList;track skins.id){
          <ion-menu-toggle>
            <ion-item-sliding>
              <ion-item>
                <ion-thumbnail class="margen-derecha">
                  <ion-img [src]="skins.image" class="img-favorit-list"></ion-img>
                </ion-thumbnail>
                <ion-label>
                  <ion-text color="primary" class="fuente-favoritos">
                    {{skins.name}}
                  </ion-text>
                </ion-label>
              </ion-item>
              <ion-item-options side="end">
                <ion-item-option color="danger" (click)="borrar(skins.id)">
                  <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
                </ion-item-option>
              </ion-item-options>
            </ion-item-sliding>
          </ion-menu-toggle>
        }
      }
    </ion-list>
  </ion-content>
</ion-menu>
